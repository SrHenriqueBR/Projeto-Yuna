name: Prévia web Yuna Viva

on:
  pull_request:
    paths:
      - 'docs/yuna-preview.html'
      - 'docs/yuna-viva.js'
      - 'docs/yuna-chat.js'
      - 'yuna_web.py'
      - 'yuna.py'
      - 'iniciar_yuna_web.bat'
      - 'tests/test_yuna_web.py'
      - 'tests/yuna_chat.test.cjs'
      - 'tests/test_yuna_live_web.py'
      - 'tests/yuna_web_controls.test.cjs'
      - '.github/workflows/yuna_live_web.yml'
  push:
    branches: [main]
    paths:
      - 'docs/yuna-preview.html'
      - 'docs/yuna-viva.js'
      - 'docs/yuna-chat.js'
      - 'yuna_web.py'
      - 'yuna.py'
      - 'iniciar_yuna_web.bat'
      - 'tests/test_yuna_web.py'
      - 'tests/yuna_chat.test.cjs'
      - 'tests/test_yuna_live_web.py'
      - 'tests/yuna_web_controls.test.cjs'
      - '.github/workflows/yuna_live_web.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar sintaxe JavaScript
        run: |
          node --check docs/yuna-viva.js
          node --check docs/yuna-chat.js
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("docs/yuna-preview.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script[^>]*>([\s\S]*?)</script>", html)
          source="\n".join(x for x in scripts if x.strip())
          Path("/tmp/yuna-inline.js").write_text(source, encoding="utf-8")
          PY
          node --check /tmp/yuna-inline.js
      - name: Testar HTML e controles do avatar
        run: |
          python -m unittest discover -s tests -p test_yuna_live_web.py -v
          python -m unittest discover -s tests -p test_yuna_web.py -v
          node --test tests/yuna_web_controls.test.cjs tests/yuna_chat.test.cjs


