name: Testes isolados Magi1020

on:
  pull_request:
    paths:
      - 'remote_camera_invite.py'
      - 'yuna_desktop.py'
      - 'tests/test_remote_camera_invite.py'
      - 'tests/test_magi1020_desktop.py'
      - '.github/workflows/testes-magi1020.yml'
  push:
    branches: [main]
    paths:
      - 'remote_camera_invite.py'
      - 'yuna_desktop.py'
      - 'tests/test_remote_camera_invite.py'
      - 'tests/test_magi1020_desktop.py'
      - '.github/workflows/testes-magi1020.yml'

jobs:
  magi1020:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar sintaxe do convite
        run: python -m compileall -q remote_camera_invite.py yuna_desktop.py tests/test_remote_camera_invite.py tests/test_magi1020_desktop.py
      - name: Dependencias da interface
        run: python -m pip install -r requirements-mascote.txt
      - name: Teste de convite e URLs sem Qt
        run: python -m unittest discover -s tests -p "test_remote_camera_invite.py" -v
      - name: Teste de consentimento da interface Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_magi1020_desktop.py" -v
