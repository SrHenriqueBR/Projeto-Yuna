name: Testes da Yuna

on:
  pull_request:
  push:
    branches: [main, feature/yuna-iniciativa-memoria-local]

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe
        run: python -m compileall -q .
      - name: Instalar bibliotecas de documentos e interface PySide6
        run: python -m pip install "python-docx>=1.2,<2" "openpyxl>=3.1,<4" "python-pptx>=1.0,<2" "reportlab>=4.2,<5" "pypdf>=5,<7" "PySide6>=6.7,<7"
      - name: Executar testes locais (Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
