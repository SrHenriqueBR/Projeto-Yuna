name: Testes da Yuna

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe
        run: python -m compileall -q .
      - name: Validar sintaxe do instalador Windows (PowerShell 5.1)
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "instalar_yuna.ps1"), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Instalar bibliotecas de documentos e interface PySide6
        run: python -m pip install -r requirements-mascote.txt
      - name: Executar testes locais (Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        run: python -m unittest discover -s tests -v
