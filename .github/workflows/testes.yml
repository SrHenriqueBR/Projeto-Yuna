name: Testes da Yuna

on:
  pull_request:
  push:
    branches: [main, feature/yuna-iniciativa-memoria-local]

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe
        run: python -m compileall -q .
      - name: Instalar criação de documentos Word
        run: python -m pip install "python-docx>=1.2,<2"
      - name: Executar testes locais
        run: python -m unittest discover -s tests -v
