name: Testes da Yuna

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe
        run: python -m compileall -q .
      - name: Instalar bibliotecas de documentos e interface PySide6
        run: python -m pip install -r requirements-mascote.txt
      - name: Executar testes locais (Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
